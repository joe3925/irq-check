[package]
name = "irq-check"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Check interrupt call paths in Rust MIR"

[[bin]]
name = "irq-check"
path = "src/main.rs"

[[bin]]
name = "irq-check-driver"
path = "src/driver.rs"

[dependencies]
irq-check-rupta = { path = "vendor/rupta" }
mimalloc = "0.1.52"
allocator-api2 = "0.2"
hashbrown = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
toml = "0.9"

[profile.release]
debug = "line-tables-only"
opt-level = 3
lto = "fat"
codegen-units = 1
