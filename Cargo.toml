[package]
name = "irq-check"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Check interrupt call paths in Rust MIR"

[[bin]]
name = "irq-check"
path = "src/main.rs"

[[bin]]
name = "irq-check-driver"
path = "src/driver.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
