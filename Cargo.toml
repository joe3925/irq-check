[package]
name = "irq-check"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Check interrupt call paths in Rust MIR"

[[bin]]
name = "irq-check"
path = "src/main.rs"

[[bin]]
name = "irq-check-driver"
path = "src/driver.rs"

[dependencies]
irq-check-rupta = { path = "vendor/rupta" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
debug = "line-tables-only"
opt-level = 3
lto = "fat"
codegen-units = 1
