[workspace]
members = ["formatting", "mixed-dyn", "correlated-dyn", "erased-records", "pointer-alias", "context-growth", "context-growth-boundary", "kernel-memory", "memory-growth", "memory-growth-roots", "writer-growth", "heap-context", "leaf-reads", "batch-frontier", "read-chain", "heap-read-chain", "context-retirement", "return-widening", "recursive-bindings", "contract-checks", "contract-dependency", "contract-leaf"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(irq_check)'] }

[profile.release]
panic = "abort"
